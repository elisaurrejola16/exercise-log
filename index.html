<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFC83D">
<title>Plate Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, bottom tab bar, cards for exercises; machine diagrams are the visual anchor */
:root{
  --bg:#EBEFF0; --surface:#FFFFFF; --surface2:#F2F5F5; --ink:#0F1B22; --muted:#53636B; --line:#D5DDDF;
  --pin:#FFC83D; --pin-ink:#1A1400;
  --up:#17724A; --up-bg:#DCF2E7; --warn:#A63D1A; --warn-bg:#FBE5DD;
  --mach:#8A979D; --body:#12806C; --arrow:#D9502A;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418; --surface:#151F25; --surface2:#1C2A31; --ink:#E8EEF0; --muted:#97A8B0; --line:#273740;
    --up:#52D69E; --up-bg:#10372A; --warn:#FF8F69; --warn-bg:#3A2019;
    --mach:#6F8089; --body:#3CC3A8; --arrow:#FF7A4D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#151F25; --surface2:#1C2A31; --ink:#E8EEF0; --muted:#97A8B0; --line:#273740;
  --up:#52D69E; --up-bg:#10372A; --warn:#FF8F69; --warn-bg:#3A2019;
  --mach:#6F8089; --body:#3CC3A8; --arrow:#FF7A4D; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
.top{display:flex;align-items:center;gap:10px;padding-block:6px 14px}
.pin{width:14px;height:26px;background:var(--pin);border-radius:3px;flex:none}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.9rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.sub{color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-left:auto}
h2{font-family:var(--font-display);font-weight:600;font-size:1.25rem;letter-spacing:.05em;text-transform:uppercase;margin:22px 0 10px;text-wrap:balance}
h3{margin:0;font-size:1.02rem;font-weight:600;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;min-height:44px;font-weight:600}
.btn.pri{background:var(--pin);color:var(--pin-ink);border-color:transparent;font-family:var(--font-display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;width:44px;height:44px;display:grid;place-items:center;font-size:1.2rem;line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:9px 14px;min-height:42px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=number],input[type=text],input[type=date],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:16px;font-variant-numeric:tabular-nums}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
.datebar{display:flex;gap:8px;align-items:center}
.datebar .when{flex:1;min-width:0;text-align:center}
.when b{font-family:var(--font-display);font-size:1.5rem;letter-spacing:.03em;text-transform:capitalize;display:block;line-height:1.1}
.banner{border-radius:14px;padding:12px 14px;background:var(--up-bg);color:var(--up);border:1px solid var(--up)}
.banner b{font-family:var(--font-display);font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase}
.banner ul{margin:6px 0 0;padding-left:18px;color:var(--ink)}
.ex{display:flex;flex-direction:column;gap:12px}
.exh{display:flex;gap:12px;align-items:flex-start}
.dgbox{width:104px;flex:none;background:var(--surface2);border-radius:10px;border:1px solid var(--line)}
.dg{display:block;width:100%;height:auto}
.dg .m{fill:none;stroke:var(--mach);stroke-linecap:round;stroke-linejoin:round}
.dg .b{fill:none;stroke:var(--body);stroke-linecap:round;stroke-linejoin:round}
.dg .a{fill:none;stroke:var(--arrow);stroke-linecap:round}
.dg .ah{fill:none;stroke:var(--arrow);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.b-up{background:var(--up-bg);color:var(--up)}
.b-hold{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.b-down{background:var(--warn-bg);color:var(--warn)}
.st{display:flex;gap:8px;align-items:flex-start}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:2.6rem 1fr 1fr 44px;gap:8px;align-items:center}
.setrow .n{font-family:var(--font-display);font-weight:600;font-size:1.2rem;color:var(--muted);text-align:center}
.setrow.nw{grid-template-columns:2.6rem 1fr 44px}
.colh{display:grid;grid-template-columns:2.6rem 1fr 1fr 44px;gap:8px;font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.colh.nw{grid-template-columns:2.6rem 1fr 44px}
details>summary{cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted);min-height:32px;display:flex;align-items:center}
details ul{margin:4px 0 0;padding-left:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{display:flex;width:100%;max-width:620px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-height:56px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";width:28px;height:4px;border-radius:2px;background:var(--pin);margin-bottom:1px}
.tabs svg{width:22px;height:22px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.libitem{display:flex;gap:12px}
.libitem .dgbox{width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--body);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--body)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.chart .lastv{fill:var(--ink);font-weight:700;font-size:11px}
.sess summary{padding-block:6px}
.sess ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;z-index:9;max-width:90%}
.toast[hidden]{display:none!important}
.sr{position:absolute;left:-9999px}
@media (max-width:380px){.exh{flex-direction:column}.dgbox{width:100%;max-width:200px}.libitem{flex-direction:column}.libitem .dgbox{width:100%;max-width:220px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>

/* ---------- progression ---------- */
function evalProg(m,item){
  const ws=item.sets.filter(s=>s.w!=null);
  if(!ws.length)return {st:'nodata'};
  const vals=ws.map(s=>s.w);
  const top=m.assist?Math.min.apply(null,vals):Math.max.apply(null,vals);
  const at=ws.filter(s=>Math.abs(s.w-top)<0.06);
  const known=at.filter(s=>s.r!=null);
  if(!known.length)return {st:'nodata',top:top};
  const inc=stepKg(m.id),eff=item.effort;
  const allMax=known.every(s=>s.r>=m.rmax),allMin=known.every(s=>s.r>=m.rmin);
  const enough=known.length>=2||eff==='easy';
  if(enough&&((allMax&&eff!=='hard')||(allMin&&eff==='easy'))){
    const next=m.assist?Math.max(0,top-inc):top+inc;
    return {st:'up',top:top,next:Math.round(next*100)/100,known:known};
  }
  if(known[0].r<m.rmin&&eff==='hard')return {st:'down',top:top,known:known};
  return {st:'hold',top:top,known:known};
}
function prevSession(id,d){const s=sessionsOf(id).filter(x=>x.date<d);return s.length?s[s.length-1]:null;}
function statusFor(id,d){
  const m=meta(id);if(!m)return {st:'none'};
  if(m.noW)return {st:'body'};
  const cur=dayItems(d).find(i=>i.ex===id);
  if(cur){const e=evalProg(m,cur);if(e.st==='up'||e.st==='hold'||e.st==='down')return Object.assign({src:'today'},e);}
  const p=prevSession(id,d);
  if(!p)return {st:cur?'nodata':'first'};
  const e=evalProg(m,p.item);
  if(e.st==='up'&&cur){
    const ws=cur.sets.filter(s=>s.w!=null).map(s=>s.w);
    if(ws.length){
      const reached=m.assist?Math.min.apply(null,ws)<=e.next+0.05:Math.max.apply(null,ws)>=e.next-0.05;
      if(reached)return {st:'done',src:'last',top:e.top};
    }
  }
  return Object.assign({src:'last',p:p},e);
}
function statusHTML(id,d){
  const m=meta(id),s=statusFor(id,d);
  let cls='b-hold',badge=t('stNo'),msg='';
  if(s.st==='up'){cls='b-up';badge=t('stUp');msg=s.src==='today'?t('msgUpToday',{w:wFmt(s.next)}):(m.assist?t('msgAssist',{w:wFmt(s.next)}):t('msgUpNow',{w:wFmt(s.next)}));}
  else if(s.st==='hold'){cls='b-hold';badge=t('stHold');msg=t('msgHold',{w:wFmt(s.top),s:m.sets,r:m.rmax});}
  else if(s.st==='down'){cls='b-down';badge=t('stDown');msg=t('msgDown',{r:m.rmin});}
  else if(s.st==='done'){cls='b-hold';badge=t('stDone');msg=t('msgDone');}
  else if(s.st==='body'){cls='b-hold';badge=m.sets+' x '+m.rmax+' s';msg=t('msgBody',{s:m.sets,r:m.rmax});}
  else if(s.st==='nodata'){msg=t('msgNoReps');}
  else{msg=s.st==='first'?t('msgFirst'):'';}
  return '<span class="badge '+cls+'">'+esc(badge)+'</span><p class="small grow">'+esc(msg)+'</p>';
}
function bannerHTML(d){
  const f=focusOf(d);
  const ids=[];
  allEx().forEach(e=>{if(f!=='rest'&&e.g===f)ids.push(e.id);});
  dayItems(d).forEach(i=>{if(ids.indexOf(i.ex)<0)ids.push(i.ex);});
  const rows=[];
  ids.forEach(id=>{
    const s=statusFor(id,d),m=meta(id);
    if(s.st==='up'&&m){
      const key=s.src==='today'?'raiseNext':(m.assist?'raiseAssist':'raiseNow');
      rows.push('<li>'+esc(t(key,{n:nm(m),w:wFmt(s.next)}))+'</li>');
    }
  });
  if(!rows.length)return '';
  return '<div class="banner" role="status"><b>'+esc(t('raiseH'))+'</b><ul>'+rows.join('')+'</ul></div>';
}
function setsLine(item,m){
  return item.sets.map(s=>{
    const w=m.noW?'':(s.w!=null?wFmt(s.w):'?');
    const r=s.r!=null?s.r:'?';
    return m.noW?(r+' s'):(w+' x '+r);
  }).join(' · ');
}

  const d=ui.date,f=focusOf(d),items=dayItems(d),r=state.logs[d];
  const when=fmtD(d,{weekday:'long'}),when2=fmtD(d,{day:'numeric',month:'long',year:'numeric'});
  let h='<div class="stack">';
  h+='<div class="datebar"><button type="button" class="icon-btn" data-act="day" data-v="-1" aria-label="'+esc(t('prev'))+'">&lsaquo;</button><div class="when"><b>'+esc(when)+'</b><span class="small muted">'+esc(when2)+'</span></div><button type="button" class="icon-btn" data-act="day" data-v="1" aria-label="'+esc(t('next'))+'">&rsaquo;</button></div>';
  h+='<div class="row"><label class="f grow" for="jump">'+esc(t('pickDate'))+'<input type="date" id="jump" data-k="jump" value="'+d+'"></label>'+(d!==todayStr()?'<button type="button" class="btn" data-act="gotoday" style="align-self:flex-end">'+esc(t('todayBtn'))+'</button>':'')+'</div>';
  h+='<div><span class="small muted" style="font-weight:600">'+esc(t('focusH'))+'</span><div class="chips" style="margin-top:6px">'+FOCI.map(k=>'<button type="button" class="chip" data-act="focus" data-v="'+k+'" aria-pressed="'+(f===k)+'">'+esc(t('g_'+k))+'</button>').join('')+'</div></div>';
  h+='<div id="banner">'+bannerHTML(d)+'</div>';
  h+='<div class="card"><h3>'+esc(t('cardioH'))+'</h3><label class="f" for="cardio" style="margin-top:8px">'+esc(t('cardioL'))+'<input type="number" inputmode="numeric" min="0" id="cardio" data-k="cardio" value="'+(r&&r.cardio!=null?r.cardio:'')+'"></label><p class="small muted" style="margin-top:6px">'+esc(t('cardioHint'))+'</p></div>';
  h+='</div>';
  h+='<h2>'+esc(t('loggedH'))+'</h2>';
  h+=items.length?'<div class="stack">'+items.map(i=>exCard(i,d)).join('')+'</div>':'<p class="muted">'+esc(f==='rest'?t('restMsg'):t('noneLogged'))+'</p>';
  const logged=items.map(i=>i.ex);
  const sugg=f==='rest'?[]:allEx().filter(e=>e.g===f&&logged.indexOf(e.id)<0);
  if(sugg.length){h+='<h2>'+esc(t('suggestedH'))+'</h2><div class="stack">'+sugg.map(e=>sugCard(e,d)).join('')+'</div>';}
  h+='<div style="margin-top:16px"><button type="button" class="btn" data-act="tab" data-v="lib">'+esc(t('addOther'))+'</button></div>';
  return h;
}
function refreshLive(id){
  const d=ui.date;
  const st=$('#st-'+id);if(st)st.innerHTML=statusHTML(id,d);
  const b=$('#banner');if(b)b.innerHTML=bannerHTML(d);
}
function addItem(id,d){
  const m=meta(id);if(!m)return;
  const day=ensureDay(d);
  if(day.items.some(i=>i.ex===id))return;
  const s=statusFor(id,d);
  let w=null;
  if(!m.noW){
    if(s.st==='up')w=s.next;
    else if(s.top!=null)w=s.top;
    else if(s.p){const e=evalProg(m,s.p.item);if(e.top!=null)w=e.top;}
  }
  const n=m.sets||3;
  const sets=[];for(let i=0;i<n;i++)sets.push({w:w,r:null});
  day.items.push({ex:id,sets:sets,effort:null,note:''});
  save();
}

/* ---------- History ---------- */
function chartHTML(id){
  const m=meta(id);if(!m)return '';
  const ss=sessionsOf(id);
  const pts=ss.map(s=>{
    let v=null;
    if(m.noW){const rs=s.item.sets.filter(x=>x.r!=null).map(x=>x.r);if(rs.length)v=Math.max.apply(null,rs);}
    else{const ws=s.item.sets.filter(x=>x.w!=null).map(x=>x.w);if(ws.length){const top=m.assist?Math.min.apply(null,ws):Math.max.apply(null,ws);v=wToD(top);}}
    return {d:s.date,v:v};
  }).filter(p=>p.v!=null);
  const title=m.noW?t('topReps'):t('topLoad')+' ('+state.wu+')';
  if(pts.length<2)return '<p class="small muted">'+esc(t('needTwo'))+'</p>';
  const W=320,H=160,pl=38,pr=14,pt=14,pb=26;
  let lo=Math.min.apply(null,pts.map(p=>p.v)),hi=Math.max.apply(null,pts.map(p=>p.v));
  if(hi===lo){hi+=1;lo-=1;}
  const x=i=>pl+(W-pl-pr)*(pts.length===1?0.5:i/(pts.length-1));
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const mid=(lo+hi)/2;
  let g='';
  [lo,mid,hi].forEach(v=>{g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(pl-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+esc(nf().format(r1(v)))+'</text>';});
  const line=pts.map((p,i)=>x(i)+','+y(p.v)).join(' ');
  const dots=pts.map((p,i)=>'<circle class="pt" cx="'+x(i)+'" cy="'+y(p.v)+'" r="3.5"/>').join('');
  const last=pts[pts.length-1];
  const lbl='<text class="lastv" x="'+x(pts.length-1)+'" y="'+(y(last.v)-8)+'" text-anchor="end">'+esc(nf().format(last.v))+'</text>';
  const xl='<text x="'+pl+'" y="'+(H-6)+'" text-anchor="start">'+esc(fmtD(pts[0].d,{day:'numeric',month:'short'}))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(fmtD(last.d,{day:'numeric',month:'short'}))+'</text>';
  return '<p class="small muted">'+esc(title)+'</p><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+'">'+g+'<polyline class="ln" points="'+line+'"/>'+dots+lbl+xl+'</svg>';
}
function viewHistory(){
  const days=Object.keys(state.logs).filter(d=>dayItems(d).length||(state.logs[d].cardio!=null&&state.logs[d].cardio!=='')).sort().reverse();
  const withData=allEx().filter(e=>sessionsOf(e.id).length);
  if(!ui.histEx||!withData.some(e=>e.id===ui.histEx))ui.histEx=withData.length?withData[0].id:null;
  let h='<h2>'+esc(t('histH'))+'</h2>';
  if(withData.length){
    h+='<div class="card stack"><label class="f" for="hx">'+esc(t('pickEx'))+'<select id="hx" data-k="hx">'+withData.map(e=>'<option value="'+e.id+'"'+(e.id===ui.histEx?' selected':'')+'>'+esc(nm(e))+'</option>').join('')+'</select></label><div id="chartbox">'+chartHTML(ui.histEx)+'</div></div>';
  }
  h+='<h2>'+esc(t('sessionsH'))+'</h2>';
  if(!days.length)return h+'<p class="muted">'+esc(t('noHistory'))+'</p>';
  h+='<div class="stack">'+days.map((d,idx)=>{
    const r=state.logs[d];
    const lis=dayItems(d).map(i=>{const m=meta(i.ex);if(!m)return '';return '<li><b>'+esc(nm(m))+'</b><br><span class="small muted">'+esc(setsLine(i,m))+(i.note?' · '+esc(i.note):'')+'</span></li>';}).join('');
    const cardio=(r.cardio!=null&&r.cardio!=='')?'<li><b>'+esc(t('cardioH'))+'</b><br><span class="small muted">'+esc(r.cardio)+' min</span></li>':'';
    return '<details class="card sess"'+(idx===0?' open':'')+'><summary><span class="grow" style="color:var(--ink)">'+esc(fmtD(d,{weekday:'long',day:'numeric',month:'long'}))+'</span><span class="badge b-hold">'+esc(t('g_'+(focusOf(d))))+'</span></summary><ul>'+lis+cardio+'</ul><div style="margin-top:10px"><button type="button" class="btn sm danger" data-act="delday" data-conf="del-'+d+'" data-d="'+d+'">'+esc(t('delDay'))+'</button></div></details>';
  }).join('')+'</div>';
  return h;
}

/* ---------- Library ---------- */
function libList(){
  const q=ui.libQ.trim().toLowerCase();
  const items=allEx().filter(e=>(ui.libG==='all'||e.g===ui.libG)&&(!q||nm(e).toLowerCase().indexOf(q)>=0||(!e.custom&&e.m[state.lang].toLowerCase().indexOf(q)>=0)));
  const logged=dayItems(ui.date).map(i=>i.ex);
  return items.map(m=>{
    const s=statusFor(m.id,ui.date);
    const badge=s.st==='up'?'<span class="badge b-up">'+esc(t('stUp'))+'</span>':'';
    const cues=(m.c&&m.c[state.lang])?'<details><summary>'+esc(t('howTo'))+'</summary><ul class="small">'+m.c[state.lang].map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul></details>':'';
    const has=logged.indexOf(m.id)>=0;
    return '<article class="card"><div class="libitem"><div class="dgbox">'+svg(m.id)+'</div><div class="grow stack" style="gap:6px"><div class="row" style="gap:8px"><h3>'+esc(nm(m))+'</h3>'+badge+'</div>'+(m.custom?'':'<p class="small muted">'+esc(m.m[state.lang])+'</p>')+'<p class="small muted">'+esc(t('g_'+m.g))+' · '+esc(t('target',{s:m.sets,a:m.rmin,b:m.rmax}))+(m.noW?' s':'')+'</p>'+cues+
      '<div><button type="button" class="btn'+(has?'':' pri')+' sm" data-act="add" data-ex="'+m.id+'"'+(has?' disabled':'')+'>'+esc(has?t('added'):t('add'))+'</button></div></div></div></article>';
  }).join('');
}
function viewLib(){
  let h='<h2>'+esc(t('libH'))+'</h2><div class="stack">';
  h+='<p class="small muted">'+esc(t('addTo'))+': '+esc(fmtD(ui.date,{weekday:'long',day:'numeric',month:'short'}))+'</p>';
  h+='<div class="chips">'+['all'].concat(GROUPS).map(g=>'<button type="button" class="chip" data-act="libg" data-v="'+g+'" aria-pressed="'+(ui.libG===g)+'">'+esc(g==='all'?t('all'):t('g_'+g))+'</button>').join('')+'</div>';
  h+='<label class="f" for="libq">'+esc(t('search'))+'<input type="text" id="libq" data-k="libq" value="'+esc(ui.libQ)+'" autocomplete="off"></label>';
  h+='<div class="stack" id="liblist">'+libList()+'</div>';
  h+='<details class="card"><summary>'+esc(t('customH'))+'</summary><div class="stack" style="margin-top:10px">'+
    '<label class="f" for="c-name">'+esc(t('cName'))+'<input type="text" id="c-name" placeholder="'+esc(t('ph_name'))+'"></label>'+
    '<label class="f" for="c-g">'+esc(t('cGroup'))+'<select id="c-g">'+GROUPS.map(g=>'<option value="'+g+'">'+esc(t('g_'+g))+'</option>').join('')+'</select></label>'+
    '<div class="grid2"><label class="f" for="c-min">'+esc(t('cMin'))+'<input type="number" inputmode="numeric" id="c-min" value="10"></label><label class="f" for="c-max">'+esc(t('cMax'))+'<input type="number" inputmode="numeric" id="c-max" value="12"></label></div>'+
    '<label class="f" for="c-sets">'+esc(t('cSets'))+'<input type="number" inputmode="numeric" id="c-sets" value="3"></label>'+
    '<div><button type="button" class="btn pri" data-act="custom">'+esc(t('create'))+'</button></div></div></details>';
  h+='</div>';
  return h;
}

/* ---------- Settings ---------- */
function viewSettings(){
  const order=[1,2,3,4,5,6,0];
  const monday='2026-10-05';
  let h='<h2>'+esc(t('setH'))+'</h2><div class="stack">';
  h+='<div class="card stack">'+
    '<div class="row"><span class="grow" style="font-weight:600">'+esc(t('langL'))+'</span><div class="seg"><button type="button" data-act="lang" data-v="es" aria-pressed="'+(state.lang==='es')+'">Español</button><button type="button" data-act="lang" data-v="en" aria-pressed="'+(state.lang==='en')+'">English</button></div></div>'+
    '<div class="row"><span class="grow" style="font-weight:600">'+esc(t('unitW'))+'</span><div class="seg"><button type="button" data-act="wu" data-v="kg" aria-pressed="'+(state.wu==='kg')+'">kg</button><button type="button" data-act="wu" data-v="lb" aria-pressed="'+(state.wu==='lb')+'">lb</button></div></div>'+
    '<div class="row"><span class="grow" style="font-weight:600">'+esc(t('unitH'))+'</span><div class="seg"><button type="button" data-act="hu" data-v="cm" aria-pressed="'+(state.hu==='cm')+'">cm</button><button type="button" data-act="hu" data-v="in" aria-pressed="'+(state.hu==='in')+'">in</button></div></div>'+
    '<div class="grid2"><label class="f" for="bw">'+esc(t('bodyW'))+' ('+state.wu+')<input type="number" inputmode="decimal" step="0.1" id="bw" data-k="bw" value="'+esc(wDisp(state.bodyKg))+'"></label>'+
    '<label class="f" for="ht">'+esc(t('heightL'))+' ('+state.hu+')<input type="number" inputmode="decimal" step="0.1" id="ht" data-k="ht" value="'+esc(hDisp(state.heightCm))+'"></label></div>'+
    '<p class="small muted" id="bmi">'+bmiText()+'</p></div>';
  h+='<h2 style="margin-top:8px">'+esc(t('schedH'))+'</h2><div class="card stack">'+order.map((wd,i)=>{
    const lab=new Intl.DateTimeFormat(loc(),{weekday:'long'}).format(dt(addDays(monday,i)));
    return '<label class="f" for="sch-'+wd+'" style="text-transform:capitalize">'+esc(lab)+'<select id="sch-'+wd+'" data-k="sch" data-wd="'+wd+'">'+FOCI.map(k=>'<option value="'+k+'"'+(state.schedule[wd]===k?' selected':'')+'>'+esc(t('g_'+k))+'</option>').join('')+'</select></label>';
  }).join('')+'</div>';
  h+='<h2 style="margin-top:8px">'+esc(t('backupH'))+'</h2><div class="card stack"><p class="small muted">'+esc(t('backupTxt'))+'</p><textarea id="bk" aria-label="'+esc(t('backupH'))+'">'+esc(JSON.stringify(state))+'</textarea><div class="row"><button type="button" class="btn" data-act="copy">'+esc(t('copy'))+'</button><button type="button" class="btn" data-act="loadbk">'+esc(t('load'))+'</button><button type="button" class="btn danger" data-act="reset" data-conf="reset">'+esc(t('resetAll'))+'</button></div></div>';
  h+='</div>';
  return h;
}
function bmiText(){
  const m=state.heightCm/100;if(!m||!state.bodyKg)return '';
  return esc(t('bmi'))+': '+nf().format(r1(state.bodyKg/(m*m)));
}

/* ---------- render ---------- */
function render(){
  renderTabs();
  viewEl.innerHTML=ui.tab==='today'?viewToday():ui.tab==='history'?viewHistory():ui.tab==='lib'?viewLib():viewSettings();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.ex,d=ui.date;
  switch(a){
    case 'tab':ui.tab=v;render();window.scrollTo(0,0);break;
    case 'day':ui.date=addDays(d,parseInt(v,10));render();break;
    case 'gotoday':ui.date=todayStr();render();break;
    case 'focus':{const r=ensureDay(d);r.focus=v;save();render();break;}
    case 'add':addItem(id,d);if(ui.tab==='lib'){toast(nm(meta(id)));$('#liblist').innerHTML=libList();}else render();break;
    case 'rmitem':if(askConfirm('rm-'+id)){const r=ensureDay(d);r.items=r.items.filter(i=>i.ex!==id);save();render();}break;
    case 'addset':{const it=dayItems(d).find(i=>i.ex===id);if(it){const l=it.sets[it.sets.length-1];it.sets.push({w:l?l.w:null,r:null});save();render();}break;}
    case 'rmset':{const it=dayItems(d).find(i=>i.ex===id);if(it){it.sets.splice(parseInt(b.dataset.i,10),1);save();render();}break;}
    case 'effort':{const it=dayItems(d).find(i=>i.ex===id);if(it){it.effort=it.effort===v?null:v;save();document.querySelectorAll('[data-act="effort"][data-ex="'+id+'"]').forEach(x=>x.setAttribute('aria-pressed',String(it.effort===x.dataset.v)));refreshLive(id);}break;}
    case 'delday':if(askConfirm('del-'+b.dataset.d)){delete state.logs[b.dataset.d];save();render();}break;
    case 'libg':ui.libG=v;render();break;
    case 'custom':{
      const name=$('#c-name').value.trim();if(!name)break;
      const mn=parseInt($('#c-min').value,10)||10,mx=Math.max(mn,parseInt($('#c-max').value,10)||12),ns=parseInt($('#c-sets').value,10)||3;
      state.custom.push({id:'c_'+Date.now().toString(36),custom:true,g:$('#c-g').value,type:'custom',sets:ns,rmin:mn,rmax:mx,inc:2.5,name:name});
      save();render();break;
    }
    case 'lang':state.lang=v;save();render();break;
    case 'wu':state.wu=v;save();render();break;
    case 'hu':state.hu=v;save();render();break;
    case 'copy':{
      const ta=$('#bk');ta.value=JSON.stringify(state);
      const fail=()=>{ta.focus();ta.select();toast(t('copyFail'));};
      try{navigator.clipboard.writeText(ta.value).then(()=>toast(t('copied')),fail);}catch(err){fail();}
      break;
    }
    case 'loadbk':{
      try{
        const o=JSON.parse($('#bk').value);
        if(!o||typeof o!=='object'||typeof o.logs!=='object')throw new Error('bad');
        state=Object.assign(seed(),o);state.schedule=Object.assign(seed().schedule,o.schedule||{});
        state.custom=o.custom||[];state.inc=o.inc||{};
        save();render();toast(t('loaded'));
      }catch(err){toast(t('badData'));}
      break;
    }
    case 'reset':if(askConfirm('reset')){state=Object.assign(seed(),{logs:{},custom:[],inc:{}});save();render();toast(t('cleared'));}break;
  }
});
document.addEventListener('input',function(e){
  const el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;
  const id=el.dataset.ex,d=ui.date;
  if(k==='w'||k==='r'){
    const it=dayItems(d).find(i=>i.ex===id);if(!it)return;
    const s=it.sets[parseInt(el.dataset.i,10)];if(!s)return;
    if(k==='w')s.w=wIn(el.value);else{const n=parseInt(el.value,10);s.r=isFinite(n)?n:null;}
    save();refreshLive(id);
  }else if(k==='note'){const it=dayItems(d).find(i=>i.ex===id);if(it){it.note=el.value;save();}}
  else if(k==='inc'){const kg=wIn(el.value);if(kg!=null&&kg>0){state.inc[id]=kg;save();refreshLive(id);}}
  else if(k==='cardio'){const r=ensureDay(d);const n=parseInt(el.value,10);r.cardio=isFinite(n)?n:null;save();}
  else if(k==='libq'){ui.libQ=el.value;$('#liblist').innerHTML=libList();}
  else if(k==='bw'){const kg=wIn(el.value);if(kg){state.bodyKg=kg;save();$('#bmi').innerHTML=bmiText();}}
  else if(k==='ht'){const cm=hIn(el.value);if(cm){state.heightCm=cm;save();$('#bmi').innerHTML=bmiText();}}
});
document.addEventListener('change',function(e){
  const el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;
  if(k==='jump'&&el.value){ui.date=el.value;render();}
  else if(k==='hx'){ui.histEx=el.value;$('#chartbox').innerHTML=chartHTML(ui.histEx);}
  else if(k==='sch'){state.schedule[el.dataset.wd]=el.value;save();}
});

render();
})();
</script>
